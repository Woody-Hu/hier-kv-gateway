[workspace]
resolver = "2"
members = [
    "crates/hier-kv-gateway-core",
    "crates/hier-kv-gateway-metadata",
    "crates/hier-kv-gateway-routing",
    "crates/hier-kv-gateway-cluster",
    "crates/hier-kv-gateway-connector",
    "crates/hier-kv-gateway-api",
    "crates/hier-kv-gateway",
    "tests/hier-kv-gateway-integration",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
hier-kv-gateway-core = { path = "crates/hier-kv-gateway-core" }
hier-kv-gateway-metadata = { path = "crates/hier-kv-gateway-metadata" }
hier-kv-gateway-routing = { path = "crates/hier-kv-gateway-routing" }
hier-kv-gateway-cluster = { path = "crates/hier-kv-gateway-cluster" }
hier-kv-gateway-connector = { path = "crates/hier-kv-gateway-connector" }
hier-kv-gateway-api = { path = "crates/hier-kv-gateway-api" }
hier-kv-gateway-integration = { path = "tests/hier-kv-gateway-integration" }

tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
axum = "0.8"
dashmap = "6"
arc-swap = "1"
thiserror = "2"
anyhow = "1"
bytes = "1"
futures = "0.3"
rand = "0.9"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
clap = { version = "4", features = ["derive"] }
toml = "0.8"
redis = { version = "0.27", features = ["tokio-comp"] }
criterion = { version = "0.5", features = ["async_tokio", "html_reports"] }
