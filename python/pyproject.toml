[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "hier-kv-gateway"
version = "0.1.0"
description = "Python SDK / glue layer for the Hier KV Gateway, an OpenAI-compatible LLM gateway."
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "Hier KV Gateway Contributors" },
]
keywords = ["llm", "gateway", "openai", "kv-cache", "routing", "inference"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.28",
    "aiohttp>=3.9",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

# Integration extras — each maps to one adapter in
# ``hier_kv_gateway.integrations``. Install only what need, e.g.
#   pip install hier-kv-gateway[vllm,langchain]
vllm = [
    # vLLM itself is intentionally NOT declared as a dependency: the adapter
    # spawns vLLM via ``python -m vllm.entrypoints.openai.api_server``, which
    # may live in a different virtualenv / container. ``requests`` (already a
    # core dep) is used for the health probe.
    "requests>=2.28",
]
llm_d = [
    "kubernetes>=28.0",
    "requests>=2.28",
]
dynamo = [
    "nats-py>=2.7",
]
openai_sdk = [
    "openai>=1.40",
]
langchain = [
    "langchain-openai>=0.1.3",
    "langchain-core>=0.1.20",
    "openai>=1.40",
]
# Convenience: install every adapter dependency at once.
all_integrations = [
    "kubernetes>=28.0",
    "nats-py>=2.7",
    "openai>=1.40",
    "langchain-openai>=0.1.3",
    "langchain-core>=0.1.20",
]

[project.urls]
Homepage = "https://github.com/hudi/hier-kv-gateway"
Repository = "https://github.com/hudi/hier-kv-gateway"

[tool.hatch.build.targets.wheel]
packages = ["hier_kv_gateway"]

[tool.hatch.build.targets.sdist]
include = [
    "hier_kv_gateway",
    "examples",
]
