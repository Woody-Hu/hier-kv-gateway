# Hier KV Gateway example configuration.
#
# This file demonstrates a typical single-node Hier KV Gateway configuration:
# - Instance identity: gateway-1
# - Region: cloud-cn-beijing
# - Listen: 0.0.0.0:8080
# - Routing strategy: hybrid (weighted mix of KV / load / topology)
# - Cluster: local port 7946 (no seed peers, single-node mode)
# - Backend: a single vLLM engine instance running on localhost:8000
#
# Usage:
#   hier-kv-gateway --config examples/hier-kv-gateway.toml

instance_id = "gateway-1"

[region]
id = "cloud-cn-beijing"
tier = "cloud"
network_zone = "cn-beijing-1"
geo = { lat = 39.9, lon = 116.4 }

[listen]
addr = "0.0.0.0"
port = 8080

[routing]
strategy = "hybrid"
kv_block_size = 16
overlap_score_credit = 1.0
prefill_load_scale = 1.0
temperature = 0.0
session_affinity_ttl_secs = 300
max_retries = 3

[routing.weights]
kv = 0.35
load = 0.30
topology = 0.20

[cluster]
bind_addr = "0.0.0.0:7946"
seed_peers = []
gossip_interval_ms = 1000
probe_timeout_ms = 5000
suspect_timeout_secs = 10

[[backends]]
backend_type = "vllm_engine"
endpoint = { url = "http://localhost:8000", protocol = "http" }
models = ["qwen2.5-7b"]
region = "cloud-cn-beijing"
kv_block_size = 16
